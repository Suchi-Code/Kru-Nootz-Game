<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นักสืบข้อมูล: ตะลุยโลกของกราฟ!</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Supabase / MathGameSDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../assets/mathgame-sdk.js"></script>

    <!-- Google Fonts: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #F0F9FF;
        }

        /* Keyframes Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        .animate-pop {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Custom scrollbar for better touch UX */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #BAE6FD;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 select-none">

    <div id="app" class="w-full max-w-4xl bg-white rounded-3xl shadow-xl border-4 border-sky-300 p-4 sm:p-8 min-h-[600px] flex flex-col justify-between relative overflow-hidden">

        <!-- ==================== หน้าหลัก (MAIN MENU) ==================== -->
        <div id="start-screen" class="flex flex-col items-center justify-center my-auto text-center space-y-6 py-8">
            <div class="text-6xl sm:text-8xl animate-bounce">🔍📊</div>
            <h1 class="text-3xl sm:text-5xl font-extrabold text-sky-600 drop-shadow-md">
                นักสืบข้อมูล: <br><span class="text-amber-500">ตะลุยโลกของกราฟ!</span>
            </h1>
            <p class="text-lg sm:text-xl text-slate-600 max-w-md">
                ท้าทายทักษะการอ่านกราฟเส้นและแผนภูมิแท่งเปรียบเทียบ ตอบถูกสะสมคะแนนเป็นสุดยอดนักสืบ! (ป.5)
            </p>
            <div id="menu-player-box" class="text-sm sm:text-base font-semibold text-sky-700 bg-sky-50 px-4 py-1.5 rounded-full border border-sky-200"></div>
            <button id="btn-start" onclick="startGame()" class="bg-amber-400 hover:bg-amber-500 active:translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-amber-400 text-slate-800 font-extrabold text-2xl sm:text-3xl px-10 py-4 rounded-full shadow-lg border-b-4 border-amber-600 transition duration-150">
                🚀 เริ่มเลย!
            </button>
        </div>

        <!-- ==================== หน้าเล่นเกม (GAMEPLAY SCREEN) ==================== -->
        <div id="game-screen" class="hidden flex-col justify-between h-full space-y-4">
            
            <!-- Header (Score & Progress) -->
            <div class="flex justify-between items-center bg-sky-100 p-3 sm:p-4 rounded-2xl border-2 border-sky-300">
                <div class="text-lg sm:text-2xl font-bold text-sky-700">
                    ข้อที่ <span id="question-number" class="text-amber-600 font-extrabold">1</span>/10
                </div>
                <div class="text-lg sm:text-2xl font-bold text-sky-700">
                    คะแนน: <span id="score-display" class="text-emerald-600 font-extrabold">0</span>
                </div>
            </div>

            <!-- Main Content Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-center my-auto">
                
                <!-- Chart Area (Upper / Left) -->
                <div class="lg:col-span-7 bg-white p-3 sm:p-4 rounded-2xl border-2 border-slate-200 shadow-inner flex flex-col justify-center items-center h-[260px] sm:h-[320px] relative">
                    <canvas id="gameChart"></canvas>
                </div>

                <!-- Question & Options Area (Lower / Right) -->
                <div class="lg:col-span-5 flex flex-col space-y-3">
                    <!-- Question Box -->
                    <div class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 shadow-sm min-h-[90px] flex items-center justify-center text-center">
                        <p id="question-text" class="text-lg sm:text-xl font-bold text-slate-800 leading-snug">
                            กำลังโหลดคำถาม...
                        </p>
                    </div>

                    <!-- Options Grid -->
                    <div id="options-container" class="grid grid-cols-1 gap-2.5">
                        <!-- Buttons rendered dynamically via JS -->
                    </div>
                </div>

            </div>

            <!-- Footer Progress Bar -->
            <div class="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-emerald-400 h-full w-0 transition-all duration-300"></div>
            </div>

        </div>

        <!-- ==================== หน้าสรุปผล (END SCREEN) ==================== -->
        <div id="end-screen" class="hidden flex-col items-center justify-center my-auto text-center space-y-6 py-8">
            <div id="end-icon" class="text-7xl sm:text-9xl">🏆</div>
            <h2 id="end-title" class="text-3xl sm:text-4xl font-extrabold text-sky-600">
                ทำได้ยอดเยี่ยมมาก!
            </h2>
            
            <div class="bg-sky-50 border-2 border-sky-300 p-6 rounded-3xl w-full max-w-sm">
                <p class="text-lg text-slate-600 font-semibold">คะแนนรวมของคุณ</p>
                <div class="text-5xl sm:text-6xl font-black text-amber-500 my-2">
                    <span id="final-score">0</span><span class="text-2xl sm:text-3xl text-slate-400">/10</span>
                </div>
                <p id="feedback-message" class="text-base sm:text-lg font-bold text-slate-700 mt-2">
                    คุณเก่งเรื่องการอ่านกราฟสุดๆ!
                </p>
            </div>

            <p id="summary-save-status" class="text-sm sm:text-base font-semibold text-slate-500"></p>

            <button id="btn-restart" onclick="startGame()" class="bg-emerald-500 hover:bg-emerald-600 active:translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-emerald-500 text-white font-extrabold text-2xl px-10 py-4 rounded-full shadow-lg border-b-4 border-emerald-700 transition duration-150">
                🔄 เล่นอีกครั้ง
            </button>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        /* Supabase / MathGameSDK wiring */
        const GAME_ID = 'game23';
        let startTime = null;
        function getElapsedSeconds() {
            return startTime ? Math.round((Date.now() - startTime) / 1000) : 0;
        }

        // Global Game State
        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];
        let chartInstance = null;
        let isAnswering = false;

        const DAYS = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์'];
        const MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.'];

        // Helper: Random Integer inclusive
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Helper: Shuffle Array
        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // Helper: Generate 4 Distinct Choices
        function generateChoices(correctVal, unit = '') {
            let choices = new Set([correctVal]);
            let attempts = 0;
            
            while (choices.size < 4 && attempts < 100) {
                attempts++;
                let offset = getRandomInt(-15, 15);
                if (offset === 0) continue;
                let dummy = correctVal + offset;
                if (dummy > 0) choices.add(dummy);
            }

            // Fallback if numbers are small
            let num = 1;
            while (choices.size < 4) {
                choices.add(correctVal + num);
                num++;
            }

            let result = Array.from(choices).map(v => `${v} ${unit}`.trim());
            return shuffleArray(result);
        }

        /* ==================== QUESTION GENERATORS ==================== */

        // 1. Generate Comparative Bar Chart Question
        function generateBarQuestion() {
            const dataSet1 = DAYS.map(() => getRandomInt(2, 10) * 5); // Multiples of 5 (10 to 50)
            const dataSet2 = DAYS.map(() => getRandomInt(2, 10) * 5);

            const qType = getRandomInt(1, 3);
            let questionText = '';
            let correctAnswer = 0;
            let unit = 'แท่ง';

            if (qType === 1) {
                // Max Day Question
                const maxVal = Math.max(...dataSet2);
                const maxIndex = dataSet2.indexOf(maxVal);
                questionText = `วันใดมียอดขาย<span class="text-purple-600 font-extrabold">ชานมไข่มุก</span>มากที่สุด?`;
                correctAnswer = DAYS[maxIndex];
                
                // Text Choices
                let choices = shuffleArray([...DAYS]);
                return {
                    chartType: 'bar',
                    title: 'จำนวนยอดขายไอศกรีมและชานมไข่มุก (วันจันทร์-ศุกร์)',
                    labels: DAYS,
                    datasets: [
                        { label: 'ไอศกรีม', data: dataSet1, backgroundColor: '#38BDF8' },
                        { label: 'ชานมไข่มุก', data: dataSet2, backgroundColor: '#A855F7' }
                    ],
                    question: questionText,
                    choices: choices,
                    correct: correctAnswer
                };
            } else if (qType === 2) {
                // Difference Question
                const targetDayIndex = getRandomInt(0, 4);
                const dayName = DAYS[targetDayIndex];
                const diff = Math.abs(dataSet1[targetDayIndex] - dataSet2[targetDayIndex]);
                const higher = dataSet1[targetDayIndex] >= dataSet2[targetDayIndex] ? 'ไอศกรีม' : 'ชานมไข่มุก';
                const lower = higher === 'ไอศกรีม' ? 'ชานมไข่มุก' : 'ไอศกรีม';

                questionText = `ในวัน<span class="text-amber-600 font-extrabold">${dayName}</span> มียอดขาย${higher}มากกว่า${lower}เท่าใด?`;
                correctAnswer = diff;
                
                return {
                    chartType: 'bar',
                    title: 'จำนวนยอดขายไอศกรีมและชานมไข่มุก (วันจันทร์-ศุกร์)',
                    labels: DAYS,
                    datasets: [
                        { label: 'ไอศกรีม', data: dataSet1, backgroundColor: '#38BDF8' },
                        { label: 'ชานมไข่มุก', data: dataSet2, backgroundColor: '#A855F7' }
                    ],
                    question: questionText,
                    choices: generateChoices(correctAnswer, unit),
                    correct: `${correctAnswer} ${unit}`
                };
            } else {
                // Total Sum Question
                const total = dataSet1.reduce((a, b) => a + b, 0);
                questionText = `รวม 5 วัน ขาย<span class="text-sky-600 font-extrabold">ไอศกรีม</span>ได้ทั้งหมดกี่แท่ง?`;
                correctAnswer = total;

                return {
                    chartType: 'bar',
                    title: 'จำนวนยอดขายไอศกรีมและชานมไข่มุก (วันจันทร์-ศุกร์)',
                    labels: DAYS,
                    datasets: [
                        { label: 'ไอศกรีม', data: dataSet1, backgroundColor: '#38BDF8' },
                        { label: 'ชานมไข่มุก', data: dataSet2, backgroundColor: '#A855F7' }
                    ],
                    question: questionText,
                    choices: generateChoices(correctAnswer, unit),
                    correct: `${correctAnswer} ${unit}`
                };
            }
        }

        // 2. Generate Line Graph Question
        function generateLineQuestion() {
            const isTemp = Math.random() > 0.5;
            const labels = isTemp ? DAYS : MONTHS;
            const timeContext = isTemp ? 'วัน' : 'เดือน';
            const unit = isTemp ? '°C' : 'บาท';

            let dataSet = [];
            if (isTemp) {
                dataSet = labels.map(() => getRandomInt(28, 38)); // Temp values
            } else {
                dataSet = labels.map(() => getRandomInt(2, 10) * 100); // Savings values
            }

            const qType = getRandomInt(1, 3);
            let questionText = '';
            let correctAnswer = 0;

            if (qType === 1) {
                // Max Value Question
                const maxVal = Math.max(...dataSet);
                const maxIndex = dataSet.indexOf(maxVal);
                const topic = isTemp ? 'อุณหภูมิสูงที่สุด' : 'เงินออมมากที่สุด';
                
                questionText = `${timeContext}ใดมี<span class="text-rose-600 font-extrabold">${topic}</span>?`;
                correctAnswer = labels[maxIndex];

                return {
                    chartType: 'line',
                    title: isTemp ? 'อุณหภูมิของจังหวัดหนึ่งในเวลา 5 วัน (°C)' : 'เงินออมของเด็กชายเอใน 5 เดือน (บาท)',
                    labels: labels,
                    datasets: [{
                        label: isTemp ? 'อุณหภูมิ (°C)' : 'เงินออม (บาท)',
                        data: dataSet,
                        borderColor: isTemp ? '#F43F5E' : '#10B981',
                        backgroundColor: isTemp ? '#FECDD3' : '#D1FAE5',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.2
                    }],
                    question: questionText,
                    choices: shuffleArray([...labels]),
                    correct: correctAnswer
                };
            } else if (qType === 2) {
                // Difference between 2 points
                const idx1 = 0;
                const idx2 = getRandomInt(2, 4);
                const diff = Math.abs(dataSet[idx1] - dataSet[idx2]);
                const topic = isTemp ? 'อุณหภูมิ' : 'เงินออม';

                questionText = `${topic}ใน${timeContext}<span class="text-sky-600 font-extrabold">${labels[idx1]}</span> แตกต่างจาก${timeContext}<span class="text-amber-600 font-extrabold">${labels[idx2]}</span> เท่าใด?`;
                correctAnswer = diff;

                return {
                    chartType: 'line',
                    title: isTemp ? 'อุณหภูมิของจังหวัดหนึ่งในเวลา 5 วัน (°C)' : 'เงินออมของเด็กชายเอใน 5 เดือน (บาท)',
                    labels: labels,
                    datasets: [{
                        label: isTemp ? 'อุณหภูมิ (°C)' : 'เงินออม (บาท)',
                        data: dataSet,
                        borderColor: isTemp ? '#F43F5E' : '#10B981',
                        backgroundColor: isTemp ? '#FECDD3' : '#D1FAE5',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.2
                    }],
                    question: questionText,
                    choices: generateChoices(correctAnswer, unit),
                    correct: `${correctAnswer} ${unit}`
                };
            } else {
                // Largest Decrease Question
                let maxDrop = -999;
                let dropIndex = 1;

                for (let i = 1; i < dataSet.length; i++) {
                    let drop = dataSet[i - 1] - dataSet[i];
                    if (drop > maxDrop) {
                        maxDrop = drop;
                        dropIndex = i;
                    }
                }

                // If no drop happened (consistently rising), force a drop at index 2
                if (maxDrop <= 0) {
                    dataSet[2] = dataSet[1] - 5;
                    dropIndex = 2;
                }

                const topic = isTemp ? 'อุณหภูมิลดลง' : 'เงินออมลดลง';
                questionText = `${timeContext}ใดมี<span class="text-rose-600 font-extrabold">${topic}</span>จาก${timeContext}ก่อนหน้ามากที่สุด?`;
                correctAnswer = labels[dropIndex];

                return {
                    chartType: 'line',
                    title: isTemp ? 'อุณหภูมิของจังหวัดหนึ่งในเวลา 5 วัน (°C)' : 'เงินออมของเด็กชายเอใน 5 เดือน (บาท)',
                    labels: labels,
                    datasets: [{
                        label: isTemp ? 'อุณหภูมิ (°C)' : 'เงินออม (บาท)',
                        data: dataSet,
                        borderColor: isTemp ? '#F43F5E' : '#10B981',
                        backgroundColor: isTemp ? '#FECDD3' : '#D1FAE5',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.2
                    }],
                    question: questionText,
                    choices: shuffleArray([...labels]),
                    correct: correctAnswer
                };
            }
        }

        // Generate 10 Questions Array
        function createQuestionBank() {
            let list = [];
            for (let i = 0; i < 5; i++) {
                list.push(generateBarQuestion());
                list.push(generateLineQuestion());
            }
            return shuffleArray(list);
        }

        /* ==================== GAME FLOW ==================== */

        function startGame() {
            // ป้องกันการกดเริ่มเกมถ้าปุ่มถูกล็อกไว้ (หัวใจหมด)
            const startBtn = document.getElementById('btn-start');
            const restartBtn = document.getElementById('btn-restart');
            if ((startBtn && startBtn.disabled) || (restartBtn && restartBtn.disabled)) {
                return;
            }

            startTime = Date.now();
            score = 0;
            currentQuestionIndex = 0;
            questions = createQuestionBank();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');

            loadQuestion();
        }

        function loadQuestion() {
            isAnswering = false;
            const q = questions[currentQuestionIndex];

            // Update Header Stats
            document.getElementById('question-number').textContent = currentQuestionIndex + 1;
            document.getElementById('score-display').textContent = score;
            
            // Progress Bar
            const progressPct = ((currentQuestionIndex) / 10) * 100;
            document.getElementById('progress-bar').style.width = `${progressPct}%`;

            // Question Text
            document.getElementById('question-text').innerHTML = q.question;

            // Render Choices Buttons
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = `w-full bg-white hover:bg-sky-50 active:scale-95 text-slate-700 font-bold text-lg sm:text-xl py-3 px-4 rounded-xl border-2 border-slate-300 shadow-sm transition duration-150 text-center animate-pop`;
                btn.textContent = choice;
                btn.onclick = () => handleAnswer(choice, btn);
                container.appendChild(btn);
            });

            // Render Chart.js
            renderChart(q);
        }

        function renderChart(qData) {
            const ctx = document.getElementById('gameChart').getContext('2d');

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: qData.chartType,
                data: {
                    labels: qData.labels,
                    datasets: qData.datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: qData.title,
                            font: { family: 'Kanit', size: 14, weight: 'bold' },
                            color: '#1E293B'
                        },
                        legend: {
                            labels: {
                                font: { family: 'Kanit', size: 12 }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { font: { family: 'Kanit' } }
                        },
                        x: {
                            ticks: { font: { family: 'Kanit' } }
                        }
                    }
                }
            });
        }

        function handleAnswer(selectedChoice, buttonElem) {
            if (isAnswering) return;
            isAnswering = true;

            const q = questions[currentQuestionIndex];
            const isCorrect = selectedChoice === q.correct;
            const app = document.getElementById('app');

            if (isCorrect) {
                score++;
                document.getElementById('score-display').textContent = score;
                buttonElem.classList.remove('bg-white', 'hover:bg-sky-50', 'border-slate-300');
                buttonElem.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
            } else {
                buttonElem.classList.remove('bg-white', 'hover:bg-sky-50', 'border-slate-300');
                buttonElem.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
                
                // Highlight Correct One
                const buttons = document.querySelectorAll('#options-container button');
                buttons.forEach(btn => {
                    if (btn.textContent === q.correct) {
                        btn.classList.remove('bg-white', 'border-slate-300');
                        btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
                    }
                });

                // Shake Animation
                app.classList.add('animate-shake');
                setTimeout(() => app.classList.remove('animate-shake'), 400);
            }

            // Move to Next Question
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < 10) {
                    loadQuestion();
                } else {
                    endGame();
                }
            }, 1200);
        }

        async function endGame() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('flex');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('end-screen').classList.add('flex');

            document.getElementById('final-score').textContent = score;

            const title = document.getElementById('end-title');
            const msg = document.getElementById('feedback-message');
            const icon = document.getElementById('end-icon');

            if (score === 10) {
                icon.textContent = '🌟';
                title.textContent = 'ยอดเยี่ยมขั้นเทพ!';
                msg.textContent = 'คุณอ่านกราฟได้อย่างแม่นยำเต็ม 10/10 คะแนน!';
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            } else if (score >= 7) {
                icon.textContent = '🏆';
                title.textContent = 'เก่งมากนักสืบ!';
                msg.textContent = 'คุณเข้าใจการอ่านกราฟและแผนภูมิได้ดีมาก!';
                confetti({ particleCount: 60, spread: 60, origin: { y: 0.6 } });
            } else if (score >= 5) {
                icon.textContent = '👍';
                title.textContent = 'ทำได้ดี!';
                msg.textContent = 'พยายามอีกนิดนะ รับรองว่าเต็มแน่นอน!';
            } else {
                icon.textContent = 'ปลูกพลัง 💡';
                title.textContent = 'สู้ๆ นะ!';
                msg.textContent = 'ลองกลับไปซ้อมอ่านกราฟเพิ่มอีกนิด แล้วมาลุยใหม่นะ!';
            }

            await onGameFinished(score, 10);
        }

        async function onGameFinished(finalScore, totalQuestions) {
            const elapsed = getElapsedSeconds();
            const statusEl = document.getElementById('summary-save-status');

            if (window.MathGameSDK) {
                try {
                    const res = await MathGameSDK.submitScore(GAME_ID, finalScore, totalQuestions, elapsed);
                    if (res.saved) {
                        statusEl.textContent = 'บันทึกคะแนนขึ้นกระดานผู้นำแล้ว!';
                    } else if (res.reason === 'not-better') {
                        statusEl.textContent = 'รอบนี้ไม่ดีกว่าคะแนนเดิม จึงยังเก็บคะแนนเดิมไว้';
                    } else if (res.reason === 'no-hearts') {
                        statusEl.textContent = 'ใช้หัวใจครบ 3 ดวงแล้ว รอบนี้จะไม่บันทึกคะแนนใหม่';
                    } else if (res.reason === 'no-player') {
                        statusEl.textContent = 'ยังไม่มีชื่อผู้เล่น คะแนนนี้จะไม่ถูกบันทึก';
                    } else {
                        statusEl.textContent = 'บันทึกคะแนนไม่สำเร็จ ลองใหม่อีกครั้ง';
                    }
                } catch (e) {
                    statusEl.textContent = 'บันทึกคะแนนไม่สำเร็จ ลองใหม่อีกครั้ง';
                }
            } else {
                statusEl.textContent = 'ไม่พบระบบบันทึกคะแนน (MathGameSDK) คะแนนนี้จะไม่ถูกบันทึก';
            }

            await refreshStartButton();
        }

        async function refreshStartButton() {
            const startBtn = document.getElementById('btn-start');
            const restartBtn = document.getElementById('btn-restart');
            if (!window.MathGameSDK) return;

            const status = await MathGameSDK.getGameStatus(GAME_ID);
            // status = { played: true/false, hearts: number|null }

            let disabled, startLabel, restartLabel;
            if (!status.played) {
                disabled = false;
                startLabel = '🚀 เริ่มเลย!';
                restartLabel = '🔄 เล่นอีกครั้ง';
            } else if (status.hearts === null || status.hearts > 0) {
                disabled = false;
                startLabel = '🔄 เล่นอีกครั้ง (เหลือ ' + status.hearts + ' หัวใจ)';
                restartLabel = '🔄 เล่นอีกครั้ง (เหลือ ' + status.hearts + ' หัวใจ)';
            } else {
                disabled = true;
                startLabel = '💔 ใช้หัวใจครบแล้ว';
                restartLabel = '💔 ใช้หัวใจครบแล้ว';
            }

            if (startBtn) {
                startBtn.disabled = disabled;
                startBtn.textContent = startLabel;
            }
            if (restartBtn) {
                restartBtn.disabled = disabled;
                restartBtn.textContent = restartLabel;
            }
        }

        window.onload = async function() {
            var playerBox = document.getElementById('menu-player-box');
            if (window.MathGameSDK) {
                var player = MathGameSDK.getPlayer();
                if (player && player.name) {
                    playerBox.innerHTML = 'ผู้เล่น: <strong>' + String(player.name).replace(/</g, '&lt;') + '</strong>';
                } else {
                    playerBox.innerHTML = 'ยังไม่มีชื่อผู้เล่น คะแนนจะไม่ถูกบันทึก ' +
                        '<a href="' + (document.referrer || '../index.html') + '" class="underline text-sky-600">กลับไปใส่ชื่อก่อน</a>';
                }
            } else if (playerBox) {
                playerBox.innerHTML = 'ไม่พบระบบผู้เล่น (MathGameSDK)';
            }
            await refreshStartButton();
        };
    </script>
</body>
</html>
